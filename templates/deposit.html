{% extends 'base.html' %}

{% block title %}Deposit | ATM Banking{% endblock %}
{% block extracss %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/deposit.css') }}">
{% endblock %}

{% block content %}
<h1>Deposit</h1>
<form method="post">
    <label for="amount">Enter the amount to deposit:</label>
    <input type="number" name="amount" required>
    <input type="submit" value="Deposit">
</form>

{% if info %}
<h3 style="color: red;">{{info}}</h3>
{% endif %}
{% endblock %}
