<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>{% block title %}ATM Banking{% endblock %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
        {% block extracss %} {% endblock %}
        <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
    </head>
    <body>
        <nav aria-label="Primary navigation">
        <a class="brand" href="{% if session.get('username') %}/dashboard/{{ session['username'] }}{% else %}/login{% endif %}">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span>ATM Banking</span>
        </a>
        <div class="nav-links">
        {% if session.get("username") %}
        <a href="/dashboard/{{session['username']}}">Dashboard</a>
        <a href="/logout">Logout</a>
        {% else %}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
        {% endif %}
        </div>
        </nav>

        <main>
            {% block content %}{% endblock %}
        </main>

            <footer aria-label="Site footer">
                 &copy; 2026 ATM Banking. Secure and reliable banking.
             </footer>
    </body>
</html>
